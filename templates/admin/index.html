<!DOCTYPE html>
<html>
<head>
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Photo -> Video</title>
    <link rel="stylesheet" type="text/css" href="style.css">
    <style>
        html{
            scrollbar-width: none;
            -ms-overflow-style: none;
            scroll-behavior: smooth;
        }
        @font-face {
            font-family: Pro;
            src: url({{ url_for('static', filename='fonts/Roboto-Medium.ttf') }});
        }
        body {
            background: linear-gradient(to bottom right, rgba(163, 11, 184, 1), #080426), url(./pics/surf.jpg);
            height: 100%; 
            min-height: 100vh; 
            background-repeat: no-repeat; 
            background-size: cover; 
            background-attachment: fixed; 
            background-position: center;
        }
    
        .user-details {
            position: absolute;
            top: 20px;
            right: 50px;
            color: white;
            background-color: rgba(255, 255, 255, 0.1);
            border-radius:7px;
            font-family: Pro;
            /* padding:5px 10px; */
            font-size: 16px;
            z-index: 1000;
        }
        .user-details p {
            margin: 10px 18px 10px 18px;
            display:flex;
            justify-content: center;
            text-align: center;
        }
        .logout {
            width:100%;
            height: 0;
            z-index: 2000;
            color: white;
            background-color:rgb(219, 54, 54);
            /* margin:4px 4px 4px 4px;  */
            font-family: Pro;
            font-size: 16px;
            border-radius: 0 0 7px 7px;
            /* transition: 0.2s; */
            transition: 0.5s;
            overflow: hidden;
            text-align: center;
        }
        .nav:hover .logout {
            /* margin-bottom: 4px; */
            height: 100%;
            padding: 3px 45px;
        }
        .heading{
            display:flex;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 30px;
            color: white;
            font-family: Pro;
            font-size: 70px;
            z-index: 1000;  
        }
        .photos-div {
            display: flex;
            justify-content: center;
        }
        .photos-div img {
            width: 100px;
            height: 100px;
            border-radius: 10px;
            margin: 10px;
            object-fit: cover;
        }
    </style>
</head>
<body class = "body bg-black">
    <div class="heading">
        <h1>Admin Page</h1>
    </div>
    <div class="nav">
        <!-- function to get user details -->
        <!-- Replace "User Name" and "user@example.com" with actual user data -->
        <div class="user-details">
            <p>admin</p>
            <p>admin@admin</p>
            <div class="logout">
                <button>Log out</button>
            </div>
        </div>
    </div>
    <div class="photos-div">
        <div class="flex flex-wrap">
            {{ users|safe }}
        </div>
</body>
</html>
